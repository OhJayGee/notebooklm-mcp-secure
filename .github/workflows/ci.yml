name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Lockfile drift detection. `npm ci` is supposed to be idempotent
      # against package-lock.json — if `git diff` shows a change, either
      # the lockfile and package.json are out of sync, or something in
      # the install resolved differently than the committed lockfile
      # claims. Either case is a supply-chain risk worth failing on.
      - name: Lockfile drift check
        run: git diff --exit-code -- package-lock.json

      # Verify every installed package has a valid registry signature.
      # Catches a compromised mirror, tampered tarball, or maintainer-key
      # compromise before the dep gets baked into a build. Requires npm 9.5+.
      - name: Verify package signatures (Sigstore)
        run: npm audit signatures

      # Vulnerability ratchet. Fails the build on any known high or
      # critical CVE in the dependency tree. Moderate/low are surfaced
      # but do not block (those are routinely false-positive-heavy).
      - name: npm audit (fail on high)
        run: npm audit --audit-level=high

      # Pin enforcement: refuse to build if any direct dep in package.json
      # uses a range specifier (^, ~, >=, latest). Prevents drift away from
      # the reviewed-tarball pin strategy. No GitHub event inputs used.
      - name: Enforce exact-version pins
        run: node ./scripts/check-exact-pins.cjs

      - name: Build (TypeScript)
        run: npm run build

      - name: Run tests
        run: npm test

  security-scan:
    # MEDUSA scan — runs in parallel with build. Enforces the
    # `medusaIntegration` claim in package.json. Severity threshold is
    # `fail_on: high` per .medusa.yml.
    # NOTE: verify the pip package name against your MEDUSA distribution;
    # if your team uses a different install channel (homebrew, curl-install),
    # replace the install step accordingly.
    name: Security scan (MEDUSA)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Install MEDUSA
        run: |
          python -m pip install --upgrade pip
          python -m pip install medusa-security

      - name: Run MEDUSA scan
        run: medusa scan . --fail-on high
